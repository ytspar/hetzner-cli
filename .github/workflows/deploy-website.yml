name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: [website/**, .github/workflows/deploy-website.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'fffa2cbba41f8b0e145472fe76c90065' }}
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'hctl' }}
  WEBSITE_ORIGIN: ${{ vars.WEBSITE_ORIGIN || 'https://hctl.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          NODE_ENV: production
          VITE_BASE_URL: /
          VITE_PROD_ORIGIN: ${{ env.WEBSITE_ORIGIN }}
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@3.114.17 pages deploy website/dist \
            --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${COMMIT_MESSAGE}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.workflow }}
