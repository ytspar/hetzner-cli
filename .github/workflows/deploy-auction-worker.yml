name: Deploy Auction Cache Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare/auction-cache-worker.js
      - wrangler.auction.toml
      - .github/workflows/deploy-auction-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'fffa2cbba41f8b0e145472fe76c90065' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Worker
        run: npx --yes wrangler@3.114.17 deploy --config wrangler.auction.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
